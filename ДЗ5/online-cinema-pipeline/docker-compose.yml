name: online-cinema

services:
  kafka-1:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka-1
    ports:
      - "9092:9092"   # с хоста: localhost:9092
    environment: &kafka-common
      # --- KRaft-кластер из 3 узлов: каждый и broker, и controller (кворум 2 из 3) ---
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # --- Репликация по умолчанию и для служебных топиков ---
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # топики создаёт только kafka-init
      KAFKA_HEAP_OPTS: "-Xmx400m -Xms256m"       # три брокера на ноутбуке
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka-1:29092"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  kafka-2:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka-2
    ports:
      - "9093:9092"   # с хоста: localhost:9093
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://localhost:9093
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka-2:29092"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  kafka-3:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka-3
    ports:
      - "9094:9092"   # с хоста: localhost:9094
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,PLAINTEXT_HOST://localhost:9094
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka-3:29092"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: schema-registry
    depends_on: &kafka-healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3   # топик _schemas тоже реплицирован
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    healthcheck:
      # в образе нет curl: HTTP-запрос через bash /dev/tcp, ждём 200 от /subjects
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /subjects HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  # Одноразовый контейнер: создаёт topic и регистрирует схему, затем завершается
  kafka-init:
    image: online-cinema/movie-service:latest
    build:
      context: .
      dockerfile: movie-service/Dockerfile
    container_name: kafka-init
    command: ["python", "init_kafka.py"]
    depends_on:
      schema-registry:
        condition: service_healthy
    environment: &app-env
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      TOPIC: movie-events
      TOPIC_PARTITIONS: 3
      TOPIC_REPLICATION: 3
      TOPIC_MIN_ISR: 2
    restart: "no"

  movie-service:
    image: online-cinema/movie-service:latest
    build:
      context: .
      dockerfile: movie-service/Dockerfile
    container_name: movie-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"   # HTTP API: http://localhost:8000/docs
    environment:
      <<: *app-env
      GENERATOR_ENABLED: "true"
      EVENTS_PER_SECOND: 5
      GENERATOR_CONCURRENCY: 20
      PUBLISH_MAX_ATTEMPTS: 5
      PUBLISH_BACKOFF_BASE: 0.5
      PUBLISH_BACKOFF_MAX: 8
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - "8123:8123"   # HTTP-интерфейс: http://localhost:8123/play
    environment:
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d/kafka.xml:/etc/clickhouse-server/config.d/kafka.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "cinema", "--password", "cinema", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Одноразовый контейнер: применяет SQL-миграции ClickHouse
  clickhouse-migrations:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse-migrations
    entrypoint: ["bash", "/migrate.sh"]
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka-init:   # Kafka-таблице нужны существующий topic и схема в Registry
        condition: service_completed_successfully
    environment:
      CH_HOST: clickhouse
      CH_USER: cinema
      CH_PASSWORD: cinema
    volumes:
      - ./clickhouse/migrations:/migrations:ro
      - ./clickhouse/migrate.sh:/migrate.sh:ro
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: metrics
      POSTGRES_USER: metrics
      POSTGRES_PASSWORD: metrics
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrics -d metrics"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-совместимое хранилище SeaweedFS (MinIO больше не публикует Docker-образы).
  # S3 API: localhost:8333 (ключи cinema / cinema-secret, seaweedfs/s3.json)
  # Просмотр файлов: http://localhost:8888/buckets/movie-analytics/daily/
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    command: ["server", "-dir=/data", "-master.volumeSizeLimitMB=1024",
              "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "8333:8333"
      - "8888:8888"
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # master отвечает по HTTP, S3-порт принимает соединения (без ключей S3 вернул бы 403)
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 8333"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # Сервис агрегации: ClickHouse -> метрики -> PostgreSQL, по расписанию и по HTTP
  aggregation-service:
    image: online-cinema/aggregation-service:latest
    build:
      context: .
      dockerfile: aggregation-service/Dockerfile
    container_name: aggregation-service
    ports:
      - "8001:8000"   # http://localhost:8001/docs
    depends_on:
      clickhouse-migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema
      TOP_MOVIES_LIMIT: 10
      POSTGRES_DSN: postgresql://metrics:metrics@postgres:5432/metrics
      PG_RETRY_ATTEMPTS: 5
      PG_RETRY_BASE: 0.5
      PG_RETRY_MAX: 8
      AGG_INTERVAL_SECONDS: 60     # период планового пересчёта
      AGG_CRON: ""                 # альтернатива интервалу, например "*/5 * * * *"
      AGG_LOOKBACK_DAYS: 8         # пересчитывать сегодня + 8 прошедших дней
      AGG_RUN_ON_START: "true"
      <<: &s3-env
        S3_ENDPOINT: seaweedfs:8333
        S3_ACCESS_KEY: cinema
        S3_SECRET_KEY: cinema-secret
        S3_BUCKET: movie-analytics
        S3_PREFIX: daily
      EXPORT_ENABLED: "true"
      EXPORT_INTERVAL_SECONDS: 300  # проверка: новый завершённый день / изменения / прошлые ошибки
      EXPORT_CRON: ""               # или строго раз в сутки: "15 0 * * *"
      EXPORT_LOOKBACK_DAYS: 10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Сквозные тесты. Не стартуют при `docker compose up` (profile test);
  # запуск: docker compose run --rm integration-tests — зависимости поднимутся сами
  integration-tests:
    image: online-cinema/movie-service:latest
    build:
      context: .
      dockerfile: movie-service/Dockerfile
    profiles: ["test"]
    command: ["pytest", "-v", "-m", "integration", "tests/integration"]
    depends_on:
      movie-service:
        condition: service_healthy
      clickhouse-migrations:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      RUN_INTEGRATION: "1"
      API_URL: http://movie-service:8000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema
      IT_WAIT_TIMEOUT: 60

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    ports:
      - "3000:3000"   # http://localhost:3000 (admin / admin)
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"           # смотреть дашборд можно без логина
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/cinema.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro   # datasource ClickHouse + провайдер дашбордов
      - ./grafana/dashboards:/etc/grafana/dashboards:ro       # JSON дашборда
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s   # при первом старте скачивается плагин ClickHouse
    depends_on:
      clickhouse-migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  # Сквозные тесты сервиса агрегации: docker compose run --rm aggregation-integration-tests
  aggregation-integration-tests:
    image: online-cinema/aggregation-service:latest
    build:
      context: .
      dockerfile: aggregation-service/Dockerfile
    profiles: ["test"]
    command: ["pytest", "-v", "-m", "integration", "tests/integration"]
    depends_on:
      aggregation-service:
        condition: service_healthy
    environment:
      RUN_INTEGRATION: "1"
      AGG_API_URL: http://aggregation-service:8000
      <<: *s3-env
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema
      POSTGRES_DSN: postgresql://metrics:metrics@postgres:5432/metrics

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    depends_on: *kafka-healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  clickhouse-data:
  postgres-data:
  grafana-data:
  seaweedfs-data:
